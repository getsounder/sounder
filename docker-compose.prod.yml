# 生产部署：直接用镜像，不本地构建。
#   cp .env.example .env   # 填 token、密码、模型 key
#   docker compose -f docker-compose.prod.yml up -d
name: sounder

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "5"

x-security: &security
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  sounder-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sounder
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: sounder
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sounder -d sounder"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "2", memory: 2G }
    logging: *logging

  sounder-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging

  sounder-minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sounder}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 1G }
    logging: *logging

  sounder-minio-init:
    image: minio/mc:latest
    depends_on:
      sounder-minio:
        condition: service_healthy
    environment:
      MINIO_USER: ${MINIO_USER:-sounder}
      MINIO_PASSWORD: ${MINIO_PASSWORD:?set MINIO_PASSWORD}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://sounder-minio:9000 $${MINIO_USER} $${MINIO_PASSWORD} &&
      mc mb -p local/sounder || true &&
      mc anonymous set none local/sounder || true
      "
    logging: *logging

  sounder-gateway:
    image: ${REGISTRY:-ghcr.io/getsounder}/sounder-gateway:${TAG:-latest}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: ["/tmp"]
    user: "65534:65534"
    command:
      - "-addr=0.0.0.0:9090"
      - "-token=${SOUNDER_TOKEN:?set SOUNDER_TOKEN}"
      - "-stale=90s"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9090/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging

  sounder-server:
    image: ${REGISTRY:-ghcr.io/getsounder}/sounder-server:${TAG:-latest}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: ["/tmp"]
    user: "65534:65534"
    command:
      - "-addr=0.0.0.0:8000"
      - "-gateway=http://sounder-gateway:9090"
      - "-gateway-token=${SOUNDER_TOKEN:?set SOUNDER_TOKEN}"
      - "-token=${SOUNDER_TOKEN:?set SOUNDER_TOKEN}"
      - "-store=postgres"
      - "-dsn=postgres://sounder:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@sounder-postgres:5432/sounder?sslmode=disable"
      - "-auth=${SOUNDER_AUTH:-true}"
      - "-public-url=${SOUNDER_PUBLIC_URL:-http://localhost:8000}"
      - "-web-url=${SOUNDER_WEB_URL:-http://localhost:3000}"
      - "-cookie-secure=${SOUNDER_COOKIE_SECURE:-true}"
      - "-cookie-domain=${SOUNDER_COOKIE_DOMAIN:-}"
      - "-local-auth=${SOUNDER_LOCAL_AUTH:-true}"
      - "-registration=${SOUNDER_REGISTRATION:-true}"
      - "-require-email-verify=${SOUNDER_REQUIRE_EMAIL_VERIFY:-false}"
      - "-native-redirect=${SOUNDER_NATIVE_REDIRECT:-sounder://auth/callback}"
      - "-google-client-id=${SOUNDER_GOOGLE_CLIENT_ID:-}"
      - "-google-client-secret=${SOUNDER_GOOGLE_CLIENT_SECRET:-}"
      - "-github-client-id=${SOUNDER_GITHUB_CLIENT_ID:-}"
      - "-github-client-secret=${SOUNDER_GITHUB_CLIENT_SECRET:-}"
      - "-dev-provider=false"
      - "-smtp-addr=${SOUNDER_SMTP_ADDR:-}"
      - "-smtp-user=${SOUNDER_SMTP_USER:-}"
      - "-smtp-pass=${SOUNDER_SMTP_PASS:-}"
      - "-smtp-from=${SOUNDER_SMTP_FROM:-no-reply@sounder.local}"
    depends_on:
      sounder-gateway:
        condition: service_healthy
      sounder-postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20
    deploy:
      resources:
        limits: { cpus: "1", memory: 512M }
    logging: *logging

  sounder-worker:
    image: ${REGISTRY:-ghcr.io/getsounder}/sounder-worker:${TAG:-latest}
    restart: unless-stopped
    <<: *security
    read_only: true
    tmpfs: ["/tmp"]
    user: "10001:10001"
    command:
      - "-addr=0.0.0.0:8080"
      - "-data=/data"
      - "-max=${WORKER_MAX:-4}"
      - "-model=${MODEL:-minimax-cn/MiniMax-M3}"
      - "-gateway=ws://sounder-gateway:9090/v1/tunnel"
      - "-gateway-token=${SOUNDER_TOKEN:?set SOUNDER_TOKEN}"
      - "-worker-kind=cloud"
      - "-worker-id=sounder-worker-1"
    environment:
      MINIMAX_CN_API_KEY: ${MINIMAX_CN_API_KEY:-}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - workerdata:/data
      - workspace:/workspace
    depends_on:
      sounder-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s
    stop_grace_period: 300s
    deploy:
      resources:
        limits: { cpus: "4", memory: 4G }
    logging: *logging

  sounder-web:
    image: ${REGISTRY:-ghcr.io/getsounder}/sounder-web:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      sounder-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 256M }
    logging: *logging

volumes:
  pgdata:
  redisdata:
  miniodata:
  workerdata:
  workspace:
