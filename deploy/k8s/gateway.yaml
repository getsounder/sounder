apiVersion: v1
kind: Service
metadata:
  name: sounder-gateway
  namespace: sounder
spec:
  selector:
    app: sounder-gateway
  ports:
    - name: http
      port: 9090
      targetPort: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounder-gateway
  namespace: sounder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sounder-gateway
  template:
    metadata:
      labels:
        app: sounder-gateway
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: ghcr.io/getsounder/sounder-gateway:dev
          args:
            - "-addr=0.0.0.0:9090"
            - "-token=$(SOUNDER_TOKEN)"
            - "-worker-secret=$(SOUNDER_WORKER_SECRET)"
            - "-stale=90s"
          env:
            - name: SOUNDER_TOKEN
              valueFrom:
                secretKeyRef: { name: sounder-secrets, key: SOUNDER_TOKEN }
            - name: SOUNDER_WORKER_SECRET
              valueFrom:
                secretKeyRef: { name: sounder-secrets, key: SOUNDER_WORKER_SECRET }
          ports:
            - containerPort: 9090
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 9090 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
