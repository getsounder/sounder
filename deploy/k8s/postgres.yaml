apiVersion: v1
kind: Service
metadata:
  name: sounder-postgres
  namespace: sounder
spec:
  clusterIP: None
  selector:
    app: sounder-postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sounder-postgres
  namespace: sounder
spec:
  serviceName: sounder-postgres
  replicas: 1
  selector:
    matchLabels:
      app: sounder-postgres
  template:
    metadata:
      labels:
        app: sounder-postgres
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef: { name: sounder-config, key: POSTGRES_DB }
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef: { name: sounder-config, key: POSTGRES_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sounder-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 5432
          resources:
            requests: { cpu: "250m", memory: "512Mi" }
            limits: { cpu: "1", memory: "2Gi" }
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "sounder", "-d", "sounder"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 20Gi
