apiVersion: v1
kind: Service
metadata:
  name: sounder-server
  namespace: sounder
spec:
  selector:
    app: sounder-server
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sounder-server
  namespace: sounder
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sounder-server
  template:
    metadata:
      labels:
        app: sounder-server
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: ghcr.io/getsounder/sounder-server:dev
          args:
            - "-addr=0.0.0.0:8000"
            - "-gateway=$(GATEWAY_URL)"
            - "-gateway-token=$(SOUNDER_TOKEN)"
            - "-token=$(SOUNDER_TOKEN)"
            - "-store=postgres"
            - "-dsn=postgres://sounder:$(POSTGRES_PASSWORD)@$(POSTGRES_HOST):5432/$(POSTGRES_DB)?sslmode=disable"
          envFrom:
            - configMapRef: { name: sounder-config }
          env:
            - name: SOUNDER_TOKEN
              valueFrom:
                secretKeyRef: { name: sounder-secrets, key: SOUNDER_TOKEN }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: sounder-secrets, key: POSTGRES_PASSWORD }
          ports:
            - containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits: { cpu: "1", memory: "512Mi" }
          readinessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: tmp
          emptyDir: {}
